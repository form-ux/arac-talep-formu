<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araç Kiralama Talebi</title>

  <style>
    body{
      margin:0;
      padding:0;
      background:#f2f4f7;
      font-family:Arial,sans-serif;
      color:#111;
    }

    .container{
      max-width:650px;
      margin:30px auto;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    .desc{
      text-align:center;
      color:#666;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin-top:15px;
      font-weight:bold;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:13px;
      margin-top:7px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
      box-sizing:border-box;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:20px;
      border:none;
      border-radius:12px;
      background:#25D366;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#1ebe5d;
    }

    .save-btn{
      background:#111;
    }

    .save-btn:hover{
      background:#333;
    }

    .price-box{
      display:none;
      margin-top:18px;
      padding:18px;
      border-radius:14px;
      background:#f0fff5;
      border:1px solid #25D366;
      text-align:center;
    }

    .price-main{
      font-size:22px;
      font-weight:bold;
      color:#111;
    }

    .deposit{
      margin-top:10px;
      color:#b00020;
      font-weight:bold;
      font-size:18px;
    }

    .deposit-desc{
      margin-top:7px;
      font-size:14px;
      color:#666;
    }

    .warning{
      display:none;
      margin-top:15px;
      color:#b00020;
      font-size:14px;
    }

    .small{
      text-align:center;
      color:#777;
      font-size:13px;
      margin-top:15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Araç Kiralama Talebi</h1>

    <p class="desc">
      Formu doldurun, bilgileriniz WhatsApp mesajı olarak hazır olsun.
    </p>

    <form id="rentalForm">

      <label>Ad *</label>
      <input type="text" id="ad" required>

      <label>Soyad *</label>
      <input type="text" id="soyad" required>

      <label>Telefon *</label>
      <input type="tel" id="telefon" required>

      <label>E-posta</label>
      <input type="email" id="email">

      <label>Alış Tarihi *</label>
      <input type="date" id="alisTarihi" onchange="fiyatHesapla()" required>

      <label>Alış Saati *</label>
      <input type="time" id="alisSaati" required>

      <label>Teslim Tarihi *</label>
      <input type="date" id="teslimTarihi" onchange="fiyatHesapla()" required>

      <label>Teslim Saati *</label>
      <input type="time" id="teslimSaati" required>

      <label>Araç Sınıfı *</label>
      <select id="aracSinifi" onchange="modelleriGetir()" required>
        <option value="">Araç sınıfı seçin...</option>
        <option value="Ekonomik">Ekonomik</option>
        <option value="SUV">SUV</option>
        <option value="Lüks">Lüks</option>
        <option value="Van / Minibüs / Combo">Van / Minibüs / Combo</option>
      </select>

      <label>Araç Modeli *</label>
      <select id="aracModeli" onchange="fiyatHesapla()" required>
        <option value="">Önce araç sınıfı seçin...</option>
      </select>

      <div class="price-box" id="fiyatKutusu">
        <div class="price-main">
          Toplam Fiyat:
          <span id="toplamFiyat">0 TL</span>
        </div>

        <div class="deposit">
          + 5.000 TL Depozito
        </div>

        <div class="deposit-desc">
          Depozito araç tesliminde iade edilir.
        </div>
      </div>

      <label>Şehir *</label>
      
<input
  list="sehirler"
  id="sehir"
  placeholder="Şehir yazın veya seçin..."
  required
>

<datalist id="sehirler">

  <option value="Adana">
  <option value="Adıyaman">
  <option value="Afyonkarahisar">
  <option value="Ağrı">
  <option value="Aksaray">
  <option value="Amasya">
  <option value="Ankara">
  <option value="Antalya">
  <option value="Ardahan">
  <option value="Artvin">
  <option value="Aydın">
  <option value="Balıkesir">
  <option value="Bartın">
  <option value="Batman">
  <option value="Bayburt">
  <option value="Bilecik">
  <option value="Bingöl">
  <option value="Bitlis">
  <option value="Bolu">
  <option value="Burdur">
  <option value="Bursa">
  <option value="Çanakkale">
  <option value="Çankırı">
  <option value="Çorum">
  <option value="Denizli">
  <option value="Diyarbakır">
  <option value="Düzce">
  <option value="Edirne">
  <option value="Elazığ">
  <option value="Erzincan">
  <option value="Erzurum">
  <option value="Eskişehir">
  <option value="Gaziantep">
  <option value="Giresun">
  <option value="Gümüşhane">
  <option value="Hakkari">
  <option value="Hatay">
  <option value="Iğdır">
  <option value="Isparta">
  <option value="İstanbul">
  <option value="İzmir">
  <option value="Kahramanmaraş">
  <option value="Karabük">
  <option value="Karaman">
  <option value="Kars">
  <option value="Kastamonu">
  <option value="Kayseri">
  <option value="Kırıkkale">
  <option value="Kırklareli">
  <option value="Kırşehir">
  <option value="Kilis">
  <option value="Kocaeli">
  <option value="Konya">
  <option value="Kütahya">
  <option value="Malatya">
  <option value="Manisa">
  <option value="Mardin">
  <option value="Mersin">
  <option value="Muğla">
  <option value="Muş">
  <option value="Nevşehir">
  <option value="Niğde">
  <option value="Ordu">
  <option value="Osmaniye">
  <option value="Rize">
  <option value="Sakarya">
  <option value="Samsun">
  <option value="Siirt">
  <option value="Sinop">
  <option value="Sivas">
  <option value="Şanlıurfa">
  <option value="Şırnak">
  <option value="Tekirdağ">
  <option value="Tokat">
  <option value="Trabzon">
  <option value="Tunceli">
  <option value="Uşak">
  <option value="Van">
  <option value="Yalova">
  <option value="Yozgat">
  <option value="Zonguldak">

</datalist>


      <label>Teslim Alma Noktası *</label>
      <input type="text" id="teslimAlma" required>

      <label>Teslim Etme Noktası *</label>
      <input type="text" id="teslimEtme" required>

      <label>Ek Not</label>
      <textarea id="not" placeholder="Eklemek istediğiniz not varsa yazabilirsiniz..."></textarea>

      <p class="warning" id="warning">
        Lütfen zorunlu alanları doldurun (*)
      </p>

      <button type="button" onclick="whatsappGonder()">
        WhatsApp ile Gönder
      </button>

      <button type="button" class="save-btn" onclick="formuKaydet()">
        Formu Kaydet
      </button>

    </form>

    <p class="small">
      Bu form bilgileri WhatsApp mesajı olarak hazırlar.
    </p>

  </div>

  <script>
    const WHATSAPP_NUMBER = "905303715406";

    const araclar = {
      "Ekonomik":[
        { model:"Renault Megane", fiyat:1500 },
        { model:"Fiat Egea", fiyat:1500 },
        { model:"Renault Clio", fiyat:1500 },
        { model:"Hyundai i20", fiyat:1400 },
        { model:"Toyota Corolla", fiyat:1900 },
        { model:"Honda Civic", fiyat:2000 },
        { model:"Volkswagen Jetta", fiyat:1600 },
        { model:"Ford Focus", fiyat:1700 },
        { model:"Ford Puma", fiyat:1400 },
        { model:"Fiat Egea Cross", fiyat:1500 },
        { model:"Citroen C4", fiyat:2000 },
        { model:"Fiat Doblo", fiyat:1600 },
        { model:"Volkswagen Passat", fiyat:2200 },
        { model:"Hyundai Elentra", fiyat:1740 },
        { model:"Skoda Super-B", fiyat:1800 },
        { model:"Hyundai Bayon", fiyat:1500 },
        { model:"Fiat 500L", fiyat:2000 }
      ],

      "SUV":[
        { model:"Nissan Qashqai", fiyat:3100 },
        { model:"Hyundai Tucson", fiyat:2900 },
        { model:"Peugeot 408", fiyat:2500 },
        { model:"Peugeot 2008", fiyat:2200 },
        { model:"Renault Duster", fiyat:1950 },
        { model:"Peugeot 3008", fiyat:2600 },
        { model:"Ford Raptor", fiyat:1900 },
        { model:"Volkswagen Amarok", fiyat:2300 },
        { model:"Toyota Hilux", fiyat:3300 },
        { model:"Mitsubishi L200", fiyat:2500 },
        { model:"Mercedes X-Class", fiyat:7900 },
        { model:"Bmw X1", fiyat:2400 },
        { model:"Volkswagen Tiguan", fiyat:2300 },
        { model:"Jeep Avenger", fiyat:5500 }
      ],

      "Lüks":[
        { model:"Bmw 520", fiyat:4400 },
        { model:"Audi A6", fiyat:4800 },
        { model:"Audi A4", fiyat:3400 },
        { model:"Byd Seal", fiyat:3800 },
        { model:"Mercedes C200", fiyat:4200 },
        { model:"Bmw 320", fiyat:3900 },
        { model:"Mercedes Cla200", fiyat:2700 },
        { model:"Volvo Xc90", fiyat:8800 },
        { model:"Volvo S90", fiyat:7600 },
        { model:"Mercedes X-Class", fiyat:7900 },
        { model:"Jeep Avenger", fiyat:5500 }
      ],

      "Van / Minibüs / Combo":[
        { model:"Volkswagen Transporter", fiyat:3100 },
        { model:"Fiat Ducato", fiyat:3300 },
        { model:"Ford Tourneo", fiyat:2200 },
        { model:"Volkswagen Caravelle", fiyat:3500 },
        { model:"Mercedes Vito", fiyat:3200 },
        { model:"Ford Tourneo Connect", fiyat:2200 },
        { model:"Fiat Doblo", fiyat:1600 }      ]
    };

    function value(id){
      return document.getElementById(id).value.trim();
    }

    function modelleriGetir(){
      const sinif = value("aracSinifi");
      const modelSelect = document.getElementById("aracModeli");

      modelSelect.innerHTML = '<option value="">Araç modeli seçin...</option>';

      if(araclar[sinif]){
        araclar[sinif].forEach(arac => {
          const option = document.createElement("option");
          option.value = arac.model;
          option.textContent = `${arac.model} - Günlük ${arac.fiyat.toLocaleString("tr-TR")} TL`;
          option.dataset.fiyat = arac.fiyat;
          modelSelect.appendChild(option);
        });
      }

      document.getElementById("fiyatKutusu").style.display = "none";
      document.getElementById("toplamFiyat").textContent = "0 TL";
    }

    function gunSayisiHesapla(){
      const alis = new Date(value("alisTarihi"));
      const teslim = new Date(value("teslimTarihi"));

      if(!value("alisTarihi") || !value("teslimTarihi")){
        return 0;
      }

      let gun = Math.ceil((teslim - alis) / (1000 * 60 * 60 * 24));

      if(gun < 1){
        gun = 1;
      }

      return gun;
    }

    function secilenGunlukFiyat(){
      const modelSelect = document.getElementById("aracModeli");
      const secilenOption = modelSelect.options[modelSelect.selectedIndex];

      if(!secilenOption || !secilenOption.dataset.fiyat){
        return 0;
      }

      return Number(secilenOption.dataset.fiyat);
    }

    function fiyatHesapla(){
      const gun = gunSayisiHesapla();
      const gunlukFiyat = secilenGunlukFiyat();

      if(gun === 0 || gunlukFiyat === 0){
        document.getElementById("fiyatKutusu").style.display = "none";
        return;
      }

      const toplam = gun * gunlukFiyat;

      document.getElementById("fiyatKutusu").style.display = "block";
      document.getElementById("toplamFiyat").textContent =
        toplam.toLocaleString("tr-TR") + " TL";
    }

    function kontrolEt(){
      const zorunluAlanlar = [
        "ad",
        "soyad",
        "telefon",
        "alisTarihi",
        "alisSaati",
        "teslimTarihi",
        "teslimSaati",
        "aracSinifi",
        "aracModeli",
        "sehir",
        "teslimAlma",
        "teslimEtme"
      ];

      for(let id of zorunluAlanlar){
        if(!value(id)){
          document.getElementById("warning").style.display = "block";
          return false;
        }
      }

      document.getElementById("warning").style.display = "none";
      return true;
    }

    function mesajOlustur(){
      const gun = gunSayisiHesapla();
      const gunlukFiyat = secilenGunlukFiyat();
      const toplam = gun * gunlukFiyat;

      return `Yeni Araç Kiralama Talebi

Ad Soyad:
${value("ad")} ${value("soyad")}

Telefon:
${value("telefon")}

E-posta:
${value("email") || "Belirtilmedi"}

Alış Tarihi / Saati:
${value("alisTarihi")} - ${value("alisSaati")}

Teslim Tarihi / Saati:
${value("teslimTarihi")} - ${value("teslimSaati")}

Kiralama Süresi:
${gun} gün

Araç Sınıfı:
${value("aracSinifi")}

Araç Modeli:
${value("aracModeli")}

Günlük Fiyat:
${gunlukFiyat.toLocaleString("tr-TR")} TL

Toplam Fiyat:
${toplam.toLocaleString("tr-TR")} TL

Depozito:
5.000 TL

Şehir:
${value("sehir")}

Teslim Alma Noktası:
${value("teslimAlma")}

Teslim Etme Noktası:
${value("teslimEtme")}

Not:
${value("not") || "Yok"}`;
    }

 function whatsappGonder()
 {
  if(!kontrolEt()) return;

  const mesaj = mesajOlustur();

  const encodedMesaj = encodeURIComponent(mesaj);

  const isMobile =
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  let url = "";

  if(isMobile){

    url =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMesaj}`;

  }else{

    url =
      `https://web.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodedMesaj}`;

  }

  window.open(url, "_blank");
}

    function formuKaydet(){
      if(!kontrolEt()) return;

      const veri = {
        ad:value("ad"),
        soyad:value("soyad"),
        telefon:value("telefon"),
        email:value("email"),

        alisTarihi:value("alisTarihi"),
        alisSaati:value("alisSaati"),
        teslimTarihi:value("teslimTarihi"),
        teslimSaati:value("teslimSaati"),

        aracSinifi:value("aracSinifi"),
        aracModeli:value("aracModeli"),

        toplamFiyat:document.getElementById("toplamFiyat").textContent,
        depozito:"5.000 TL",

        sehir:value("sehir"),
        teslimAlma:value("teslimAlma"),
        teslimEtme:value("teslimEtme"),
        not:value("not")
      };

      localStorage.setItem("sonForm", JSON.stringify(veri));
      alert("Form bu cihazda kaydedildi.");
    }
  </script>

</body>
</html>
